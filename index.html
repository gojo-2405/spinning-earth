<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Realistic Earth Final</title>

<style>
body { margin:0; overflow:hidden; background:black; }

#info {
    position:absolute;
    top:20px;
    left:20px;
    color:white;
    background:rgba(0,0,0,0.6);
    padding:10px;
    border-radius:8px;
    font-family:Arial;
}
</style>
</head>

<body>


<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>

<script>
// Scene
const scene = new THREE.Scene();

// Camera
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 5000);
camera.position.z = 5;

// Renderer
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

// Controls
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// 🌗 Lighting (important for day/night effect)
scene.add(new THREE.AmbientLight(0x222222)); // darker ambient

const sun = new THREE.PointLight(0xffffff, 2);
sun.position.set(10, 0, 10); // better direction
scene.add(sun);

// Texture loader
const loader = new THREE.TextureLoader();

// 🌍 Earth (FIXED MATERIAL)
const earth = new THREE.Mesh(
    new THREE.SphereGeometry(1, 64, 64),
    new THREE.MeshStandardMaterial({
        map: loader.load("earth.jpg"),

        emissive: 0xffffff,
        emissiveMap: loader.load("earth_night.jpg"),
        emissiveIntensity: 1.5,

        roughness: 1,
        metalness: 0
    })
);
scene.add(earth);

// 🌫️ Atmosphere
const atmosphere = new THREE.Mesh(
    new THREE.SphereGeometry(1.08, 64, 64),
    new THREE.MeshBasicMaterial({
        color:0x3399ff,
        transparent:true,
        opacity:0.2
    })
);
scene.add(atmosphere);

// 🌌 Stars
const starGeo = new THREE.BufferGeometry();
let starPos = [];

for(let i=0;i<20000;i++){
    starPos.push((Math.random()-0.5)*4000);
    starPos.push((Math.random()-0.5)*4000);
    starPos.push((Math.random()-0.5)*4000);
}

starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos,3));

const stars = new THREE.Points(
    starGeo,
    new THREE.PointsMaterial({color:0xffffff,size:0.6})
);
scene.add(stars);

// 🌌 Galaxy background
const galaxy = new THREE.Mesh(
    new THREE.SphereGeometry(2000, 64, 64),
    new THREE.MeshBasicMaterial({
        map: loader.load("https://threejs.org/examples/textures/galaxy_starfield.png"),
        side: THREE.BackSide
    })
);
scene.add(galaxy);

// 🪐 Planets (far + slow)
const planet1 = new THREE.Mesh(
    new THREE.SphereGeometry(0.5,32,32),
    new THREE.MeshStandardMaterial({color:0xaaaaaa})
);
scene.add(planet1);

const planet2 = new THREE.Mesh(
    new THREE.SphereGeometry(0.7,32,32),
    new THREE.MeshStandardMaterial({color:0x8888ff})
);
scene.add(planet2);

// Spin control
let isSpinning = true;

// Click toggle
window.addEventListener("click", () => {
    isSpinning = !isSpinning;
});

// Animation
let angle = 0;

function animate(){
    requestAnimationFrame(animate);

    if(isSpinning){
        earth.rotation.y += 0.0006; // slow realistic
    }

    // Slow orbit
    angle += 0.001;

    planet1.position.set(
        Math.cos(angle)*20,
        2,
        Math.sin(angle)*20
    );

    planet2.position.set(
        Math.cos(angle*0.7)*30,
        -3,
        Math.sin(angle*0.7)*30
    );

    controls.update();
    renderer.render(scene, camera);
}
animate();

// Resize
window.addEventListener("resize",()=>{
    renderer.setSize(innerWidth,innerHeight);
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
});
</script>

</body>
</html>
