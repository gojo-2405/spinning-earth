<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Earth Pro UI</title>

<style>
body { margin:0; overflow:hidden; background:black; }

#info {
    position:absolute;
    top:20px;
    left:20px;
    color:white;
    background:rgba(0,0,0,0.6);
    padding:10px;
    border-radius:8px;
    font-family:Arial;
}

#searchBox {
    position:absolute;
    top:20px;
    right:20px;
    padding:8px;
    border-radius:5px;
    border:none;
}
</style>
</head>

<body>

<div id="info">🌍 Hover / Click country</div>
<input id="searchBox" placeholder="Search country..."/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>

<script>
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1000);
camera.position.z = 3;

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

// Controls
const controls = new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping = true;

// Lights
scene.add(new THREE.AmbientLight(0x888888));
const light = new THREE.PointLight(0xffffff,2);
light.position.set(5,3,5);
scene.add(light);

// Earth
const earthTexture = textureLoader.load(
  "https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg"
);
const earth = new THREE.Mesh(
    new THREE.SphereGeometry(1,64,64),
    new THREE.MeshStandardMaterial({map:texture})
);
scene.add(earth);

// Atmosphere
const atm = new THREE.Mesh(
    new THREE.SphereGeometry(1.05,64,64),
    new THREE.MeshBasicMaterial({color:0x3399ff,transparent:true,opacity:0.2})
);
scene.add(atm);

// Stars
const starGeo = new THREE.BufferGeometry();
let starPos = [];
for(let i=0;i<8000;i++){
    starPos.push((Math.random()-0.5)*2000);
    starPos.push((Math.random()-0.5)*2000);
    starPos.push((Math.random()-0.5)*2000);
}
starGeo.setAttribute('position',new THREE.Float32BufferAttribute(starPos,3));
scene.add(new THREE.Points(starGeo,new THREE.PointsMaterial({color:0xffffff,size:0.7})));

// Country borders group
const borderGroup = new THREE.Group();
scene.add(borderGroup);

let countries = [];

// Convert lat/lon → 3D
function latLonToVec3(lat, lon){
    const phi = (90-lat)*(Math.PI/180);
    const theta = (lon+180)*(Math.PI/180);

    return new THREE.Vector3(
        -Math.sin(phi)*Math.cos(theta),
        Math.cos(phi),
        Math.sin(phi)*Math.sin(theta)
    );
}

// Load GeoJSON
fetch("countries.geo.json")
.then(res=>res.json())
.then(data=>{
    countries = data.features;

    countries.forEach(country=>{
        const geo = country.geometry;

        if(geo.type === "Polygon"){
            drawPolygon(geo.coordinates);
        }
        if(geo.type === "MultiPolygon"){
            geo.coordinates.forEach(poly=>drawPolygon(poly));
        }
    });
});

// Draw borders
function drawPolygon(coords){
    coords.forEach(ring=>{
        const points = ring.map(c=>{
            const v = latLonToVec3(c[1],c[0]);
            return v.multiplyScalar(1.01);
        });

        const geo = new THREE.BufferGeometry().setFromPoints(points);
        const line = new THREE.Line(
            geo,
            new THREE.LineBasicMaterial({color:0xffffff})
        );
        borderGroup.add(line);
    });
}

// Raycaster
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

// Find country
function findCountry(lat, lon){
    for(let c of countries){
        const geo = c.geometry;

        if(geo.type === "Polygon"){
            if(pointInPolygon([lon,lat],geo.coordinates[0])){
                return c.properties.name;
            }
        }

        if(geo.type === "MultiPolygon"){
            for(let poly of geo.coordinates){
                if(pointInPolygon([lon,lat],poly[0])){
                    return c.properties.name;
                }
            }
        }
    }
    return null;
}

// Polygon check
function pointInPolygon(point, vs){
    let x=point[0], y=point[1], inside=false;

    for(let i=0,j=vs.length-1;i<vs.length;j=i++){
        let xi=vs[i][0], yi=vs[i][1];
        let xj=vs[j][0], yj=vs[j][1];

        let intersect=((yi>y)!=(yj>y)) &&
        (x<(xj-xi)*(y-yi)/(yj-yi)+xi);

        if(intersect) inside=!inside;
    }
    return inside;
}

// Hover + Click
window.addEventListener("mousemove",event=>{
    mouse.x=(event.clientX/innerWidth)*2-1;
    mouse.y=-(event.clientY/innerHeight)*2+1;

    raycaster.setFromCamera(mouse,camera);
    const hit=raycaster.intersectObject(earth);

    if(hit.length>0){
        const p=hit[0].point;

        const lat=90-(Math.acos(p.y)*180/Math.PI);
        const lon=(Math.atan2(p.z,p.x)*180/Math.PI);

        const country=findCountry(lat,lon);

        if(country){
            document.getElementById("info").innerText="🌍 "+country;
        }
    }
});

// Search
document.getElementById("searchBox").addEventListener("input",e=>{
    const val=e.target.value.toLowerCase();

    const found=countries.find(c=>
        c.properties.name.toLowerCase().includes(val)
    );

    if(found){
        document.getElementById("info").innerText="🔍 "+found.properties.name;
    }
});

// Animation
function animate(){
    requestAnimationFrame(animate);

    earth.rotation.y+=0.0008;
    controls.update();

    renderer.render(scene,camera);
}
animate();

// Resize
window.addEventListener("resize",()=>{
    renderer.setSize(innerWidth,innerHeight);
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
});
</script>

</body>
</html>
