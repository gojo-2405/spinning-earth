<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Advanced 3D Earth</title>
<style>
    body { margin: 0; overflow: hidden; background: black; }
    canvas { display: block; }

    #info {
        position: absolute;
        top: 20px;
        left: 20px;
        color: white;
        font-family: Arial;
        background: rgba(0,0,0,0.5);
        padding: 10px;
        border-radius: 8px;
    }
</style>
</head>
<body>

<div id="info">Click on Earth 🌍</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>

<script>
const scene = new THREE.Scene();

// Camera
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.z = 3;

// Renderer
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Controls
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;

// Lighting
const light = new THREE.PointLight(0xffffff, 2);
light.position.set(5,3,5);
scene.add(light);

const ambient = new THREE.AmbientLight(0x888888);
scene.add(ambient);

// Earth
const geometry = new THREE.SphereGeometry(1, 64, 64);
const textureLoader = new THREE.TextureLoader();

const earthTexture = textureLoader.load(
  "https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg"
);

const material = new THREE.MeshStandardMaterial({ map: earthTexture });
const earth = new THREE.Mesh(geometry, material);
scene.add(earth);

// Atmosphere
const atmGeo = new THREE.SphereGeometry(1.05, 64, 64);
const atmMat = new THREE.MeshBasicMaterial({
    color: 0x3399ff,
    transparent: true,
    opacity: 0.2
});
const atmosphere = new THREE.Mesh(atmGeo, atmMat);
scene.add(atmosphere);

// 🌌 Stars
const starGeo = new THREE.BufferGeometry();
const starCount = 10000;
const posArray = [];

for(let i=0;i<starCount;i++){
    posArray.push(
        (Math.random()-0.5)*2000,
        (Math.random()-0.5)*2000,
        (Math.random()-0.5)*2000
    );
}

starGeo.setAttribute('position', new THREE.Float32BufferAttribute(posArray,3));
const starMat = new THREE.PointsMaterial({color:0xffffff,size:0.7});
const stars = new THREE.Points(starGeo, starMat);
scene.add(stars);

// 🪐 Planet
const planetGeo = new THREE.SphereGeometry(0.3,32,32);
const planetMat = new THREE.MeshStandardMaterial({color:0xff8844});
const planet = new THREE.Mesh(planetGeo, planetMat);
planet.position.set(3,1,-2);
scene.add(planet);

// 🌍 Country Data Load
let countries = [];

fetch("countries.geo.json")
.then(res => res.json())
.then(data => {
    countries = data.features;
    console.log("Countries loaded:", countries.length);
});

// 🖱️ Click Detection
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

window.addEventListener("click",(event)=>{
    mouse.x = (event.clientX / window.innerWidth)*2 - 1;
    mouse.y = -(event.clientY / window.innerHeight)*2 + 1;

    raycaster.setFromCamera(mouse,camera);
    const intersects = raycaster.intersectObject(earth);

    if(intersects.length > 0){
        document.getElementById("info").innerText = "🌍 Earth clicked!";
    }
});

// Animation
function animate(){
    requestAnimationFrame(animate);

    earth.rotation.y += 0.001;
    planet.rotation.y += 0.01;

    controls.update();
    renderer.render(scene,camera);
}
animate();

// Resize
window.addEventListener("resize",()=>{
    renderer.setSize(window.innerWidth,window.innerHeight);
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
});
</script>

</body>
</html>
