<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3d Earth Map</title>

<style>
body { margin:0; overflow:hidden; background:black; }
</style>
</head>

<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>

<script>
// Scene
const scene = new THREE.Scene();

// Camera
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 5000);
camera.position.z = 5;

// Renderer
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

// Controls
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// Lighting
scene.add(new THREE.AmbientLight(0x333333));

const sun = new THREE.PointLight(0xffffff, 2);
sun.position.set(10, 0, 10);
scene.add(sun);

// Texture loader
const loader = new THREE.TextureLoader();

// 🌍 Earth
const earth = new THREE.Mesh(
    new THREE.SphereGeometry(1, 64, 64),
    new THREE.MeshStandardMaterial({
        map: loader.load("earth.jpg"),
        roughness: 1,
        metalness: 0
    })
);
scene.add(earth);

// 🌫️ Atmosphere
const atmosphere = new THREE.Mesh(
    new THREE.SphereGeometry(1.08, 64, 64),
    new THREE.MeshBasicMaterial({
        color:0x3399ff,
        transparent:true,
        opacity:0.2
    })
);
scene.add(atmosphere);

// 🌌 Stars
const starGeo = new THREE.BufferGeometry();
let starPos = [];

for(let i=0;i<20000;i++){
    starPos.push((Math.random()-0.5)*4000);
    starPos.push((Math.random()-0.5)*4000);
    starPos.push((Math.random()-0.5)*4000);
}

starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos,3));

const stars = new THREE.Points(
    starGeo,
    new THREE.PointsMaterial({color:0xffffff,size:0.6})
);
scene.add(stars);

// 🌌 Galaxy background
const galaxy = new THREE.Mesh(
    new THREE.SphereGeometry(2000, 64, 64),
    new THREE.MeshBasicMaterial({
        map: loader.load("https://threejs.org/examples/textures/galaxy_starfield.png"),
        side: THREE.BackSide
    })
);
scene.add(galaxy);

// 🪐 Multiple realistic distant planets
const planets = [];

function createPlanet(size, color, distance, speed, yOffset){
    const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(size, 32, 32),
        new THREE.MeshStandardMaterial({
            color: color,
            emissive: color,
            emissiveIntensity: 0.15
        })
    );

    scene.add(mesh);

    planets.push({
        mesh: mesh,
        distance: distance,
        speed: speed,
        angle: Math.random() * Math.PI * 2,
        y: yOffset
    });
}

// Create planets (far + slow)
createPlanet(0.4, 0xaaaaaa, 25, 0.0005, 2);
createPlanet(0.6, 0x8888ff, 35, 0.0003, -3);
createPlanet(0.3, 0xffaa66, 45, 0.0002, 1);
createPlanet(0.7, 0x66ffcc, 55, 0.00015, -2);
createPlanet(0.5, 0xff6666, 65, 0.0001, 3);

// Spin control
let isSpinning = true;

// Click toggle
window.addEventListener("click", () => {
    isSpinning = !isSpinning;
});

// Animation
function animate(){
    requestAnimationFrame(animate);

    // Earth rotation
    if(isSpinning){
        earth.rotation.y += 0.0006;
    }

    // Planets movement
    planets.forEach(p => {
        p.angle += p.speed;

        p.mesh.position.set(
            Math.cos(p.angle) * p.distance,
            p.y,
            Math.sin(p.angle) * p.distance
        );
    });

    controls.update();
    renderer.render(scene, camera);
}
animate();

// Resize
window.addEventListener("resize",()=>{
    renderer.setSize(innerWidth,innerHeight);
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
});
</script>

</body>
</html>
