<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cinematic Earth</title>

<style>
body { margin:0; overflow:hidden; background:black; }

#info {
    position:absolute;
    top:20px;
    left:20px;
    color:white;
    background:rgba(0,0,0,0.6);
    padding:10px;
    border-radius:8px;
    font-family:Arial;
}
</style>
</head>

<body>

<div id="info">🌍 Click to Pause / Resume</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>

<script>
// Scene
const scene = new THREE.Scene();

// Camera
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 2000);
camera.position.z = 4;

// Renderer
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

// Controls
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// Lights
scene.add(new THREE.AmbientLight(0x404040));

const sun = new THREE.PointLight(0xffffff, 2);
sun.position.set(5,3,5);
scene.add(sun);

// Texture loader
const loader = new THREE.TextureLoader();

// 🌍 Earth
const earth = new THREE.Mesh(
    new THREE.SphereGeometry(1, 64, 64),
    new THREE.MeshStandardMaterial({
        map: loader.load("earth.jpg"),
        emissive: 0x222222,
        emissiveMap: loader.load("earth_night.jpg"),
        emissiveIntensity: 0.6
    })
);
scene.add(earth);

// ☁️ Clouds
const clouds = new THREE.Mesh(
    new THREE.SphereGeometry(1.02, 64, 64),
    new THREE.MeshStandardMaterial({
        map: loader.load("clouds.png"),
        transparent: true,
        opacity: 0.4
    })
);
earth.add(clouds);

// 🌫️ Atmosphere
const atmosphere = new THREE.Mesh(
    new THREE.SphereGeometry(1.08, 64, 64),
    new THREE.MeshBasicMaterial({
        color:0x3399ff,
        transparent:true,
        opacity:0.2
    })
);
scene.add(atmosphere);

// 🌌 Stars
const starGeo = new THREE.BufferGeometry();
let starPos = [];

for(let i=0;i<15000;i++){
    starPos.push((Math.random()-0.5)*3000);
    starPos.push((Math.random()-0.5)*3000);
    starPos.push((Math.random()-0.5)*3000);
}

starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos,3));

const stars = new THREE.Points(
    starGeo,
    new THREE.PointsMaterial({color:0xffffff,size:0.7})
);
scene.add(stars);

// ✨ Galaxy background
const galaxyGeo = new THREE.SphereGeometry(1000, 64, 64);
const galaxyMat = new THREE.MeshBasicMaterial({
    map: loader.load("https://threejs.org/examples/textures/galaxy_starfield.png"),
    side: THREE.BackSide
});
const galaxy = new THREE.Mesh(galaxyGeo, galaxyMat);
scene.add(galaxy);

// 🪐 Planets
const planet1 = new THREE.Mesh(
    new THREE.SphereGeometry(0.3,32,32),
    new THREE.MeshStandardMaterial({color:0xff8844})
);
scene.add(planet1);

const planet2 = new THREE.Mesh(
    new THREE.SphereGeometry(0.2,32,32),
    new THREE.MeshStandardMaterial({color:0x44aaff})
);
scene.add(planet2);

// Spin control
let isSpinning = true;

// Click toggle
window.addEventListener("click", () => {
    isSpinning = !isSpinning;
});

// Animation
let angle = 0;

function animate(){
    requestAnimationFrame(animate);

    if(isSpinning){
        earth.rotation.y += 0.0008;
        clouds.rotation.y += 0.0012;
    }

    // Planets orbit
    angle += 0.01;

    planet1.position.set(
        Math.cos(angle)*3,
        0,
        Math.sin(angle)*3
    );

    planet2.position.set(
        Math.cos(angle*1.5)*4,
        Math.sin(angle*1.5),
        Math.sin(angle*1.5)*4
    );

    controls.update();
    renderer.render(scene, camera);
}
animate();

// Resize
window.addEventListener("resize",()=>{
    renderer.setSize(innerWidth,innerHeight);
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
});
</script>

</body>
</html>
