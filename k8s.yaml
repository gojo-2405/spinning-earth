apiVersion: v1
kind: Pod
metadata:
  name: earth-pod
  labels:
    app: earth-app
spec:
  containers:
  - name: earth-container
    image: gojo2405/earth-app:latest
    ports:
    - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: earth-service
spec:
  type: NodePort
  selector:
    app: earth-app
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30007
